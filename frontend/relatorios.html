
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatórios — Supervisor Campo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-container">

    <div class="greeting-header">
      <div class="user-info">
        <div class="greeting-name">Relatórios</div>
      </div>
    </div>

    <div class="screen">
      <div id="alert-box"></div>


      <!-- Indicadores -->
      <div class="section-label">CARTAS GERADAS</div>

      <div style="
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      ">

        <div class="card" style="margin: 0;">
          <div style="font-size: 0.9rem;">Hoje</div>
          <div id="report-today" style="
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-top: 8px;
          ">--</div>
        </div>

        <div class="card" style="margin: 0;">
          <div style="font-size: 0.9rem;">Esta semana</div>
          <div id="report-week" style="
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-top: 8px;
          ">--</div>
        </div>

        <div class="card" style="margin: 0;">
          <div style="font-size: 0.9rem;">Mês</div>
          <div id="report-month" style="
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-top: 8px;
          ">--</div>
        </div>

        <div class="card" style="margin: 0;">
          <div style="font-size: 0.9rem;">Ano</div>
          <div id="report-year" style="
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-top: 8px;
          ">--</div>
        </div>

      </div>

      <!-- Histórico -->
      <div class="section-label" style="margin-top: 24px;">
        HISTÓRICO DE CARTAS
      </div>

      <!-- Filtro de período -->
      <div class="card">
        <label for="filter-period">Período</label>
        <select id="filter-period" class="form-control">
          <option value="all">Todos</option>
          <option value="today">Hoje</option>
          <option value="week">Semana</option>
          <option value="month">Mês</option>
          <option value="year">Ano</option>
        </select>

        <!-- Filtro de usuário: exibido somente para administradores -->
        <div id="user-filter-container" style="display: none; margin-top: 12px;">
          <label for="filter-user">Usuário</label>
          <select id="filter-user" class="form-control">
            <option value="all">Todos os usuários</option>
          </select>
        </div>
      </div>

      <!-- Quantidade de registros -->
      <div style="margin: 12px 4px;">
        <span id="history-count" style="font-size: 0.85rem; color: var(--color-text-secondary);">
          Carregando histórico...
        </span>
      </div>

      <!-- Tabela de histórico -->
      <div class="card" style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
          <thead>
            <tr>
              <th style="text-align: left; padding: 10px 8px;">Data</th>
              <th style="text-align: left; padding: 10px 8px;">Usuário</th>
              <th style="text-align: left; padding: 10px 8px;">Promotor</th>
              <th style="text-align: left; padding: 10px 8px;">Matrícula</th>
              <th style="text-align: left; padding: 10px 8px;">Loja</th>
            </tr>
          </thead>

          <tbody id="history-table-body">
            <tr>
              <td colspan="5" style="text-align: center; padding: 16px;">
                Carregando registros...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>

    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        Home
      </a>

      <a href="cartas.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <path d="M14 2v6h6"/>
        </svg>
        Cartas
      </a>

      <a href="relatorios.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 20V10M12 20V4M6 20v-6"/>
        </svg>
        Relatórios
      </a>

      <a href="perfil.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21v-1a8 8 0 0116 0v1"/>
        </svg>
        Perfil
      </a>
    </nav>

  </div>

  <script src="js/api.js"></script>
  <script src="js/relatorios.js"></script>
</body>
</html>
